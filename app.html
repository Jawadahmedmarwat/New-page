<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIANA - Upload tool</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{--ink:#16213e;--bg:#f7f5f2;--acc:#e8466a;--mut:#5b6478}
*{box-sizing:border-box}
body{margin:0;font:17px/1.6 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.w{max-width:520px;margin:0 auto;padding:28px 22px}
header{display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:10px}
header a{color:var(--ink);text-decoration:none;font-weight:700;letter-spacing:.12em}
.box{background:#fff;border:1px solid #ddd8d0;border-radius:10px;padding:24px;margin-top:26px}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:12px 22px;font:600 16px system-ui;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.me{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.me img{width:56px;height:56px;border-radius:50%}
input[type=file]{display:block;margin:14px 0}
#msg{margin-top:16px;color:var(--mut)}
.err{color:#b3261e!important}.ok{color:#1b7a3d!important}
footer{margin-top:30px;font-size:14px;color:var(--mut)}footer a{margin-right:14px;color:var(--mut)}
</style>
</head>
<body>
<div class="w">
<header><img src="icon.png" alt="DIANA logo"><a href="index.html">DIANA</a></header>

<div class="box" id="out">
<h2 style="margin-top:0">Connect your TikTok</h2>
<p>Log in so DIANA can show your account and send videos to your TikTok drafts.</p>
<button id="login">Login with TikTok</button>
</div>

<div class="box" id="in" hidden>
<div class="me"><img id="av" alt="Your TikTok avatar"><div><small>Connected as</small><br><b id="nm"></b></div></div>
<label for="f"><b>Choose a video (MP4, up to 50 MB)</b></label>
<input id="f" type="file" accept="video/mp4,video/quicktime">
<button id="up">Upload to my TikTok drafts</button>
<p><a href="#" id="lo">Log out</a></p>
</div>
<p id="msg" role="status"></p>

<footer><a href="terms.html">Terms of Service</a><a href="privacy.html">Privacy Policy</a></footer>
</div>

<script>
/* ===== CHANGE THESE WHEN NEEDED (sandbox vs production) ===== */
const CFG={
  clientKey:"sbaw1e9gxcnt49v8fh",
  redirectUri:"https://waqaskhanmarwat.app.n8n.cloud/webhook/1f7184af-7095-4a21-a62e-cbe9efbfd4de",
  uploadUrl:"https://waqaskhanmarwat.app.n8n.cloud/webhook/diana-upload"
};
/* =========================================================== */
const $=id=>document.getElementById(id),S=sessionStorage;
const say=(t,c)=>{$("msg").textContent=t;$("msg").className=c||""};

function show(){
  const s=JSON.parse(S.getItem("diana")||"null");
  $("out").hidden=!!s;$("in").hidden=!s;
  if(s){$("nm").textContent=s.name;$("av").src=s.avatar}
}
// Back from TikTok via n8n: #token=..&name=..&avatar=..&state=..
if(location.hash.length>1){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("token")&&h.get("state")===S.getItem("st")){
    S.setItem("diana",JSON.stringify({token:h.get("token"),name:h.get("name"),avatar:h.get("avatar")}));
  }else if(h.get("token")){say("Login check failed. Please try again.","err")}
  history.replaceState(null,"",location.pathname);
}
show();

$("login").onclick=()=>{
  const st=crypto.randomUUID();S.setItem("st",st);
  location.href="https://www.tiktok.com/v2/auth/authorize/?"+new URLSearchParams({
    client_key:CFG.clientKey,scope:"user.info.basic,video.upload",
    response_type:"code",redirect_uri:CFG.redirectUri,state:st});
};
$("lo").onclick=e=>{e.preventDefault();S.removeItem("diana");say("");show()};

$("up").onclick=async()=>{
  const file=$("f").files[0],s=JSON.parse(S.getItem("diana")||"null");
  if(!file)return say("Choose a video first.","err");
  if(file.size>50*1024*1024)return say("This video is over 50 MB. Choose a smaller one.","err");
  const fd=new FormData();
  fd.append("token",s.token);fd.append("size",file.size);fd.append("video",file,file.name);
  $("up").disabled=true;say("Uploading...");
  try{
    const r=await fetch(CFG.uploadUrl,{method:"POST",body:fd});
    const j=await r.json();
    if(j.ok){say("Uploaded. Open TikTok and check your inbox for the draft.","ok")}
    else{say("TikTok could not accept the video: "+(j.error||"unknown error"),"err")}
  }catch(e){say("Upload failed. Check that the n8n workflow is active.","err")}
  $("up").disabled=false;
};
</script>
</body>
</html>
